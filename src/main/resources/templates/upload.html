<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候选人导入 - AI Interview Agent</title>
    <link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div id="app" data-page="upload" v-cloak>
    <th:block th:replace="~{fragments/layout :: sidebar('upload', '')}"></th:block>

    <main class="main-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">01 / 候选人导入</p>
                <h1>上传简历并生成首份诊断</h1>
            </div>
            <div class="top-actions">
                <a class="ghost-button" href="/">首页</a>
                <a class="ghost-button" href="/audit/prompt-dashboard">运营看板</a>
            </div>
        </header>

        <div class="notice error" v-if="globalError">{{ globalError }}</div>
        <div class="notice success" v-if="globalMessage">{{ globalMessage }}</div>

        <section class="workspace-grid">
            <div class="panel upload-panel"
                 v-bind:class="{ dragover: dragOver }"
                 v-on:dragover.prevent="dragOver = true"
                 v-on:dragleave.prevent="dragOver = false"
                 v-on:drop.prevent="handleDrop">
                <div class="panel-header">
                    <div>
                        <h2>候选人简历</h2>
                        <p>支持 PDF、DOC、DOCX、TXT，最大 10MB。</p>
                    </div>
                    <span class="pill">AI Analysis</span>
                </div>

                <label class="dropzone" for="resumeFile">
                    <input id="resumeFile" type="file" accept=".pdf,.doc,.docx,.txt" v-on:change="handleFileChange">
                    <span class="drop-title">{{ selectedFile ? selectedFile.name : '点击选择文件，或拖拽到这里' }}</span>
                    <span class="drop-meta">{{ selectedFile ? formatBytes(selectedFile.size) : '建议上传目标岗位相关版本' }}</span>
                </label>

                <div class="inline-actions">
                    <button class="primary-button" type="button" v-on:click="uploadResume" v-bind:disabled="!selectedFile || loading.upload">
                        {{ loading.upload ? '分析中...' : '上传并分析' }}
                    </button>
                    <button class="ghost-button" type="button" v-on:click="clearCandidate" v-bind:disabled="loading.upload">
                        清空选择
                    </button>
                </div>

                <div class="notice info" v-if="loading.upload">
                    正在解析简历、调用模型评分并写入向量库，通常需要 20-60 秒。
                </div>
            </div>

            <div class="panel outcome-panel">
                <div class="panel-header">
                    <div>
                        <h2>导入后会得到什么</h2>
                        <p>客户最关心的是“我接下来该怎么改、怎么练”。</p>
                    </div>
                </div>
                <div class="timeline">
                    <div class="timeline-item done">结构化评分：总分与五个能力维度</div>
                    <div class="timeline-item done">可执行建议：按优先级输出修改方向</div>
                    <div class="timeline-item done">向量入库：用于相似简历和 JD 增强问题</div>
                    <div class="timeline-item done">后续闭环：岗位匹配、模拟面试、复盘评估</div>
                </div>
            </div>
        </section>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
