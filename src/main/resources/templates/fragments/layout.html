<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<body>
<aside class="sidebar"
       th:fragment="sidebar(activePage, resumeId)"
       th:with="hasResume=${not #strings.isEmpty(resumeId)}">
    <a class="brand" href="/">
        <div class="brand-mark">AI</div>
        <div>
            <div class="brand-name">AI 求职顾问</div>
            <div class="brand-meta">简历与岗位匹配分析</div>
        </div>
    </a>

    <nav class="nav-list" aria-label="主导航">
        <a class="nav-item"
           th:classappend="${activePage == 'upload' ? ' active' : ''}"
           href="/upload">
            <span class="nav-index">01</span><span>候选人导入</span>
        </a>
        <a class="nav-item"
           th:classappend="${activePage == 'analysis' ? ' active' : (hasResume ? '' : ' disabled-link')}"
           th:href="${hasResume ? '/analysis/' + resumeId : '/upload'}">
            <span class="nav-index">02</span><span>简历诊断</span>
        </a>
        <a class="nav-item"
           th:classappend="${activePage == 'match' ? ' active' : (hasResume ? '' : ' disabled-link')}"
           th:href="${hasResume ? '/match/' + resumeId : '/upload'}">
            <span class="nav-index">03</span><span>岗位匹配</span>
        </a>
        <a class="nav-item"
           th:classappend="${activePage == 'interview' ? ' active' : (hasResume ? '' : ' disabled-link')}"
           th:href="${hasResume ? '/interview/' + resumeId : '/upload'}">
            <span class="nav-index">04</span><span>模拟面试</span>
        </a>
        <a class="nav-item"
           th:classappend="${activePage == 'assistant' ? ' active' : ''}"
           th:href="${hasResume ? '/assistant/' + resumeId : '/assistant'}">
            <span class="nav-index">05</span><span>AI 顾问</span>
        </a>
        <a class="nav-item"
           th:classappend="${activePage == 'ops' ? ' active' : ''}"
           href="/audit/prompt-dashboard">
            <span class="nav-index">06</span><span>运营看板</span>
        </a>
    </nav>

    <div class="side-author">
        <span>作者</span>
        <strong>谢半仙</strong>
    </div>

    <div class="side-status">
        <div class="status-label">当前简历</div>
        <div class="status-value" th:text="${hasResume ? resumeId : (activePage == 'ops' ? '运营视图' : '未选择')}">未选择</div>
    </div>
</aside>

<th:block th:fragment="scripts">
    <script src="/vendor/vue.global.prod.js"></script>
    <script src="/app/app.js"></script>
</th:block>
</body>
</html>
