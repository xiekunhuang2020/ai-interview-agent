spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-interview-assistant
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_interview}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:60s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:600s}
    reactiveclient:
      connect-timeout: ${HTTP_REACTIVE_CLIENT_CONNECT_TIMEOUT:60s}
      read-timeout: ${HTTP_REACTIVE_CLIENT_READ_TIMEOUT:600s}
  ai:
    chat:
      client:
        observations:
          log-prompt: ${AI_CHAT_OBSERVATIONS_LOG_PROMPT:false}
          log-completion: ${AI_CHAT_OBSERVATIONS_LOG_COMPLETION:false}
    retry:
      max-attempts: ${AI_MODEL_RETRY_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: ${AI_MODEL_RETRY_INITIAL_INTERVAL:800ms}
        multiplier: ${AI_MODEL_RETRY_BACKOFF_MULTIPLIER:2}
        max-interval: ${AI_MODEL_RETRY_MAX_INTERVAL:5s}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:fake-key}
      chat:
        options:
          enable-thinking: true
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: ${MILVUS_DB:default}
        collection-name: resume_vector_store
        embedding-dimension: 1024
        index-type: HNSW
        metric-type: COSINE
        initialize-schema: true

server:
  port: 8080

ai-interview:
  agent:
    audit:
      enabled: ${AI_AGENT_AUDIT_ENABLED:true}
      log-message-content: ${AI_AGENT_AUDIT_LOG_MESSAGE_CONTENT:true}
      max-message-content-length: ${AI_AGENT_AUDIT_MAX_MESSAGE_CONTENT_LENGTH:4000}
  model:
    fallback-enabled: ${AI_MODEL_FALLBACK_ENABLED:true}
  prompt:
    versions:
      resume-analysis: resume-analysis-v2026-05-17-01
      interview-question-generation: interview-question-v2026-05-17-01
      answer-evaluation: answer-evaluation-v2026-05-17-01
      jd-match: jd-match-v2026-05-17-01
      rag-interview-question-generation: rag-question-v2026-05-17-01

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xkh.ai.interview.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} %logger{36} - %msg%n"
  level:
    org.springframework.ai: DEBUG
    com.alibaba.cloud.ai: DEBUG
    com.xkh.ai.interview: DEBUG
