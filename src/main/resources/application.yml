spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ai-interview-assistant
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_interview}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:60s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:600s}
    reactiveclient:
      connect-timeout: ${HTTP_REACTIVE_CLIENT_CONNECT_TIMEOUT:60s}
      read-timeout: ${HTTP_REACTIVE_CLIENT_READ_TIMEOUT:600s}
  ai:
    model:
      audio:
        transcription: none
    chat:
      client:
        observations:
          log-prompt: ${AI_CHAT_OBSERVATIONS_LOG_PROMPT:false}
          log-completion: ${AI_CHAT_OBSERVATIONS_LOG_COMPLETION:false}
    retry:
      max-attempts: ${AI_MODEL_RETRY_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: ${AI_MODEL_RETRY_INITIAL_INTERVAL:800ms}
        multiplier: ${AI_MODEL_RETRY_BACKOFF_MULTIPLIER:2}
        max-interval: ${AI_MODEL_RETRY_MAX_INTERVAL:5s}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:fake-key}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-max}
          enable-thinking: true
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
      rerank:
        options:
          model: ${DASHSCOPE_RERANK_MODEL:qwen3-rerank}
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: ${MILVUS_DB:default}
        collection-name: resume_vector_store
        embedding-dimension: 1024
        index-type: HNSW
        metric-type: COSINE
        initialize-schema: true

server:
  port: 8080

ai-interview:
  audio:
    answer-transcription:
      model: ${DASHSCOPE_ASR_MODEL:paraformer-realtime-v2}
      max-file-size: ${AI_ANSWER_AUDIO_MAX_FILE_SIZE:10485760}
      timeout-seconds: ${AI_ANSWER_AUDIO_TIMEOUT_SECONDS:90}
  rag:
    search-mode: ${AI_RAG_SEARCH_MODE:hybrid}
    hybrid:
      collection-name: ${AI_RAG_HYBRID_COLLECTION_NAME:resume_hybrid_store}
      sync-writes: ${AI_RAG_HYBRID_SYNC_WRITES:true}
      initialize-schema: ${AI_RAG_HYBRID_INITIALIZE_SCHEMA:true}
      analyzer-type: ${AI_RAG_HYBRID_ANALYZER_TYPE:chinese}
      dense-top-k: ${AI_RAG_HYBRID_DENSE_TOP_K:20}
      sparse-top-k: ${AI_RAG_HYBRID_SPARSE_TOP_K:20}
      final-top-k: ${AI_RAG_HYBRID_FINAL_TOP_K:12}
      dense-weight: ${AI_RAG_HYBRID_DENSE_WEIGHT:0.55}
      sparse-weight: ${AI_RAG_HYBRID_SPARSE_WEIGHT:0.45}
    rerank:
      enabled: ${AI_RAG_RERANK_ENABLED:true}
      top-n: ${AI_RAG_RERANK_TOP_N:6}
  vision:
    jd-ocr-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-max}
  cost:
    chat-models:
      qwen3.7-max:
        input-per-million-tokens: ${AI_COST_QWEN37_MAX_INPUT_PER_MILLION:2.4}
        output-per-million-tokens: ${AI_COST_QWEN37_MAX_OUTPUT_PER_MILLION:9.6}
      qwen-max:
        input-per-million-tokens: ${AI_COST_QWEN_MAX_INPUT_PER_MILLION:2.4}
        output-per-million-tokens: ${AI_COST_QWEN_MAX_OUTPUT_PER_MILLION:9.6}
      qwen-plus:
        input-per-million-tokens: ${AI_COST_QWEN_PLUS_INPUT_PER_MILLION:0.8}
        output-per-million-tokens: ${AI_COST_QWEN_PLUS_OUTPUT_PER_MILLION:2}
    audio-models:
      paraformer-realtime-v2:
        per-second: ${AI_COST_PARAFORMER_REALTIME_V2_PER_SECOND:0.00024}
  agent:
    memory:
      max-messages: ${AI_AGENT_MEMORY_MAX_MESSAGES:10}
    query-rewrite:
      enabled: ${AI_AGENT_QUERY_REWRITE_ENABLED:true}
    summary:
      enabled: ${AI_AGENT_SUMMARY_ENABLED:true}
      trigger-messages: ${AI_AGENT_SUMMARY_TRIGGER_MESSAGES:8}
      keep-recent-messages: ${AI_AGENT_SUMMARY_KEEP_RECENT_MESSAGES:4}
    audit:
      enabled: ${AI_AGENT_AUDIT_ENABLED:true}
      log-message-content: ${AI_AGENT_AUDIT_LOG_MESSAGE_CONTENT:true}
      max-message-content-length: ${AI_AGENT_AUDIT_MAX_MESSAGE_CONTENT_LENGTH:4000}
  context-budget:
    enabled: ${AI_CONTEXT_BUDGET_ENABLED:true}
    resume-max-tokens: ${AI_CONTEXT_RESUME_MAX_TOKENS:2800}
    jd-max-tokens: ${AI_CONTEXT_JD_MAX_TOKENS:1200}
    answer-max-tokens: ${AI_CONTEXT_ANSWER_MAX_TOKENS:1000}
    assistant-user-message-max-tokens: ${AI_CONTEXT_ASSISTANT_USER_MESSAGE_MAX_TOKENS:700}
    rag-document-max-tokens: ${AI_CONTEXT_RAG_DOCUMENT_MAX_TOKENS:350}
    rag-total-max-tokens: ${AI_CONTEXT_RAG_TOTAL_MAX_TOKENS:1400}
    tool-resume-snippet-max-tokens: ${AI_CONTEXT_TOOL_RESUME_SNIPPET_MAX_TOKENS:260}
    tool-search-snippet-max-tokens: ${AI_CONTEXT_TOOL_SEARCH_SNIPPET_MAX_TOKENS:230}
    tool-question-max-tokens: ${AI_CONTEXT_TOOL_QUESTION_MAX_TOKENS:160}
    operation-input-token-budgets:
      resume-analysis: ${AI_BUDGET_RESUME_ANALYSIS_INPUT_TOKENS:3000}
      jd-match: ${AI_BUDGET_JD_MATCH_INPUT_TOKENS:3500}
      interview-question-generation: ${AI_BUDGET_INTERVIEW_QUESTION_INPUT_TOKENS:4000}
      rag-interview-question-generation: ${AI_BUDGET_RAG_INTERVIEW_QUESTION_INPUT_TOKENS:4000}
      answer-evaluation: ${AI_BUDGET_ANSWER_EVALUATION_INPUT_TOKENS:4000}
      interview-assistant-stream: ${AI_BUDGET_INTERVIEW_ASSISTANT_INPUT_TOKENS:2500}
      interview-assistant-query-rewrite: ${AI_BUDGET_INTERVIEW_ASSISTANT_QUERY_REWRITE_INPUT_TOKENS:1000}
      interview-assistant-summary: ${AI_BUDGET_INTERVIEW_ASSISTANT_SUMMARY_INPUT_TOKENS:1800}
      jd-image-ocr: ${AI_BUDGET_JD_IMAGE_OCR_INPUT_TOKENS:1800}
      answer-audio-transcription: ${AI_BUDGET_ANSWER_AUDIO_TRANSCRIPTION_INPUT_TOKENS:0}
      assistant-audio-transcription: ${AI_BUDGET_ASSISTANT_AUDIO_TRANSCRIPTION_INPUT_TOKENS:0}
  prompt:
    versions:
      resume-analysis: resume-analysis-v2026-06-06-02
      interview-question-generation: interview-question-v2026-05-17-01
      answer-evaluation: answer-evaluation-v2026-05-26-02
      jd-match: jd-match-v2026-05-17-01
      rag-interview-question-generation: rag-question-v2026-05-17-01
      interview-assistant-stream: assistant-stream-v2026-05-24-01
      interview-assistant-query-rewrite: assistant-query-rewrite-v2026-06-06-01
      interview-assistant-summary: assistant-summary-v2026-05-24-01
      jd-image-ocr: jd-image-ocr-v2026-05-24-01
      answer-audio-transcription: answer-audio-transcription-v2026-05-25-01
      assistant-audio-transcription: assistant-audio-transcription-v2026-05-26-01

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xkh.ai.interview.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} %logger{36} - %msg%n"
  level:
    org.springframework.ai: DEBUG
    com.alibaba.cloud.ai: DEBUG
    com.xkh.ai.interview: DEBUG
