<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 求职顾问</title>
    <link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div id="app" data-page="home" v-cloak>
    <th:block th:replace="~{fragments/layout :: sidebar('upload', '')}"></th:block>

    <main class="main-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">AI 面试增长工作台</p>
                <h1>面向程序员的简历诊断与岗位匹配顾问</h1>
            </div>
            <div class="top-actions">
                <a class="ghost-button" href="/audit/prompt-dashboard">运营看板</a>
                <a class="primary-button" href="/upload">新增候选人</a>
            </div>
        </header>

        <div class="notice info product-scope">
            <strong>当前产品定位：程序员和技术岗求职者。</strong>
            <span>围绕目标岗位说明评估简历匹配度。</span>
            <span>把能力缺口转成面试训练和简历优化方向。</span>
        </div>

        <section class="workspace-grid">
            <div class="panel hero-panel">
                <div class="panel-header">
                    <div>
                        <h2>客户交付链路</h2>
                        <p>上传简历和目标岗位说明后自动完成评分、匹配判断、面试题生成和复盘评估。</p>
                    </div>
                    <span class="pill">多页应用</span>
                </div>
                <div class="timeline">
                    <div class="timeline-item done">1. 导入候选人简历</div>
                    <div class="timeline-item done">2. 生成结构化简历诊断</div>
                    <div class="timeline-item done">3. 对齐目标岗位说明</div>
                    <div class="timeline-item done">4. 产出面试题与答题评估</div>
                </div>
            </div>

            <div class="panel outcome-panel">
                <div class="panel-header">
                    <div>
                        <h2>适合拿给客户看的能力点</h2>
                        <p>不是简单聊天机器人，而是有数据链路、有审计、有结果页的 AI 面试工作流。</p>
                    </div>
                </div>
                <div class="kpi-grid">
                    <div class="kpi"><span>检索</span><strong>向量库</strong></div>
                    <div class="kpi"><span>工作流</span><strong>工具</strong></div>
                    <div class="kpi"><span>审计</span><strong>追踪</strong></div>
                </div>
                <div class="inline-actions">
                    <a class="primary-button" href="/upload">开始体验</a>
                    <a class="ghost-button" href="/audit/prompt-dashboard">查看稳定性</a>
                </div>
            </div>
        </section>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
